name: Playwright E2E Tests

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Warm up Render backend
        run: |
          echo "Waking up Render service..."
          curl --max-time 90 --retry 3 --retry-delay 5 --silent --show-error \
            https://world-expressions.onrender.com/ > /dev/null
          echo "Render is up."

      - name: Run Playwright tests (staging)
        run: npx playwright test
        working-directory: web
        env:
          BASE_URL: https://world-expressions-git-staging-ssinanusa-gmailcoms-projects.vercel.app
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
