name: Playwright E2E Tests

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Reset test account
        run: |
          pip install psycopg2-binary sqlalchemy --quiet
          python3 scripts/reset_test_account.py --email ssin@protonmail.com
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Warm up Render backend
        run: |
          echo "Waking up Render service..."
          curl --max-time 90 --retry 3 --retry-delay 5 --silent --show-error \
            https://world-expressions.onrender.com/ > /dev/null
          echo "Render is up."

      - name: Run Playwright tests (staging)
        run: npx playwright test
        working-directory: web
        env:
          BASE_URL: https://world-expressions-git-staging-ssinanusa-gmailcoms-projects.vercel.app
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + test dependencies
        run: pip install --quiet -r requirements.txt -r requirements-test.txt

      # Le backend est lancé depuis CE commit (pas Render, qui déploie main :
      # une feature backend de staging n'y existe pas encore avant le merge).
      # Tests en lecture seule (GET uniquement) — aucune écriture en DB.
      - name: Start backend from this commit
        run: |
          python3 -m uvicorn main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 5 http://localhost:8000/ > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start:"
          cat uvicorn.log
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Run backend tests (pytest)
        run: python3 -m pytest tests/ -q
        env:
          BASE_URL: http://localhost:8000
