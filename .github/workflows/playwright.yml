name: Playwright E2E Tests

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# One run at a time per commit SHA — serialises the push and pull_request
# triggers instead of cancelling (cancelled runs count as failures in
# branch-protection checks, blocking auto-merge).
concurrency:
  group: playwright-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Wait for Vercel staging to serve this commit
        env:
          # On pull_request, github.sha is the merge preview commit (never deployed).
          # Use the branch HEAD SHA instead, which Vercel staging actually serves.
          COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "Waiting for Vercel to serve commit $COMMIT_SHA..."
          for i in $(seq 1 60); do
            deployed_sha=$(curl --silent --max-time 10 \
              -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_TOKEN }}" \
              "https://world-expressions-git-staging-ssinanusa-gmailcoms-projects.vercel.app/api/version" \
              | jq -r '.sha // ""' 2>/dev/null || echo "")
            echo "Attempt $i — deployed: $deployed_sha"
            if [ "$deployed_sha" = "$COMMIT_SHA" ]; then
              echo "Vercel is serving the correct commit."
              exit 0
            fi
            sleep 5
          done
          echo "Timeout: Vercel did not serve commit $COMMIT_SHA within 5 minutes."
          exit 1

      - name: Warm up Render backend
        run: |
          echo "Waking up Render service..."
          curl --max-time 90 --retry 3 --retry-delay 5 --silent --show-error \
            https://world-expressions.onrender.com/ > /dev/null
          echo "Render is up."

      - name: Reset test account (auth.spec.ts rejouability)
        run: |
          pip install --quiet sqlalchemy psycopg2-binary
          python3 scripts/reset_test_account.py --email ssin@protonmail.com
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Run Playwright tests (staging)
        run: npx playwright test
        working-directory: web
        env:
          BASE_URL: https://world-expressions-git-staging-ssinanusa-gmailcoms-projects.vercel.app
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
          TEST_AUTH_PASSWORD: ${{ secrets.TEST_AUTH_PASSWORD }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + test dependencies
        run: pip install --quiet -r requirements.txt -r requirements-test.txt

      # Le backend est lancé depuis CE commit (pas Render, qui déploie main :
      # une feature backend de staging n'y existe pas encore avant le merge).
      # Tests en lecture seule (GET uniquement) — aucune écriture en DB.
      - name: Start backend from this commit
        run: |
          python3 -m uvicorn main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 5 http://localhost:8000/ > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start:"
          cat uvicorn.log
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

      - name: Run backend tests (pytest)
        run: python3 -m pytest tests/ -q
        env:
          BASE_URL: http://localhost:8000
