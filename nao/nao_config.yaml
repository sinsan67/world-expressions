# Configuration documentation:
# https://docs.getnao.io/nao-agent/context-builder/configuration#nao_config-yaml

project_name: nao

# Moteur LLM : on réutilise la clé Anthropic du projet (Claude).
llm:
  provider: anthropic
  api_key: "{{ env('ANTHROPIC_API_KEY') }}"

# Base de données : Neon (Postgres), via le rôle LECTURE SEULE nao_readonly.
# Le rôle ne peut lire que les 11 tables de contenu (aucune table à données personnelles).
# Les secrets (user/password) sont lus depuis nao/.env, jamais commité.
databases:
  - name: world_expressions
    type: postgres
    host: ep-dawn-smoke-aly41brd-pooler.c-3.eu-central-1.aws.neon.tech
    port: 5432
    database: neondb
    user: "{{ env('PGUSER') }}"
    password: "{{ env('PGPASSWORD') }}"
    schema_name: public
    sslmode: require
    templates:
      - columns
      - how_to_use
      - preview

# Google Analytics 4 via BigQuery export (GCP projet wolr-497808).
# Le dataset GA4 est créé automatiquement par l'export quotidien — format : analytics_XXXXXXXXXX
# (disponible dès le lendemain du premier export).
# Credentials : nao/ga4-credentials.json (jamais commité — voir nao/.gitignore)
  - name: ga4_analytics
    type: bigquery
    project_id: "wolr-497808"
    credentials_path: "{{ env('GA4_CREDENTIALS_PATH') }}"
    templates:
      - columns
      - how_to_use
      - preview
