<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expression du Jour — @world.expressions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400;1,600&family=Inter:wght@400;500;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paper:#fdf8ee; --ink:#1c1410; --ink-soft:#5c4f47; --ink-softer:#8b7d72;
      --plum:#6b4d8f; --plum-soft:#c9b8d9; --terra:#c1543a; --gold:#d4a83a;
    }
    body {
      background:#18151f; display:flex; flex-direction:column; align-items:center;
      padding:40px 24px 60px; font-family:'Inter',system-ui,sans-serif; gap:16px;
    }
    .meta-label { color:#666; font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    .slide {
      width:540px; height:540px; background:var(--paper);
      display:flex; flex-direction:column; align-items:center; overflow:hidden;
      border-radius:16px; box-shadow:0 24px 80px rgba(0,0,0,.55);
    }
    .top-strip,.bottom-strip { width:100%; height:3px; flex-shrink:0; }
    .top-strip    { background:linear-gradient(to right,var(--gold),var(--terra),var(--plum)); }
    .bottom-strip { background:linear-gradient(to right,var(--plum),var(--terra),var(--gold)); }
    .ig-bar { width:100%; display:flex; align-items:center; gap:8px; padding:14px 20px 0; flex-shrink:0; }
    .ig-avatar { width:28px; height:28px; border-radius:7px; overflow:hidden; flex-shrink:0; }
    .ig-avatar img { width:100%; height:100%; object-fit:cover; }
    .ig-name { font-size:11px; font-weight:700; color:var(--ink); flex:1; }
    .ig-tag {
      font-size:9.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
      padding:3px 9px; border-radius:20px; background:rgba(28,20,16,.06); color:var(--ink-soft);
    }
    .body { flex:1; width:100%; padding:22px 46px 0; display:flex; flex-direction:column; justify-content:center; }
    .lang-label {
      font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
      color:var(--plum); display:flex; align-items:center; gap:8px; margin-bottom:14px;
    }
    .lang-label .flag { font-size:16px; }
    .expression {
      font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:600;
      font-size:42px; line-height:1.08; color:var(--ink); margin-bottom:12px;
    }
    .literal {
      font-family:'Caveat',cursive; font-size:24px; color:var(--terra);
      line-height:1.3; margin-bottom:20px;
    }
    .literal .arrow { color:var(--ink-softer); }
    .divider { width:44px; height:2px; background:linear-gradient(to right,var(--terra),var(--plum)); border-radius:2px; margin-bottom:20px; }
    .block { margin-bottom:16px; }
    .block-label {
      font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
      color:var(--ink-softer); margin-bottom:5px;
    }
    .block-text { font-size:15px; line-height:1.5; color:var(--ink-soft); }
    .block-text b { color:var(--ink); font-weight:600; }
    .footer { width:100%; display:flex; align-items:center; justify-content:space-between; padding:0 20px 16px; flex-shrink:0; }
    .app-url { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--plum); }
    .register-badge {
      font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
      padding:3px 10px; border-radius:20px; background:var(--plum-soft); color:var(--plum);
    }
  </style>
</head>
<body>

<p class="meta-label">Instagram — @world.expressions · Expression du Jour · 1080×1080</p>

<div class="slide">
  <div class="top-strip"></div>
  <div class="ig-bar">
    <div class="ig-avatar"><img src="../../web/public/icons/icon-192.png" alt=""></div>
    <span class="ig-name">world.expressions</span>
    <span class="ig-tag">Expression of the day</span>
  </div>

  <div class="body">
    <div class="lang-label"><span class="flag" id="flag"></span><span id="langLabel"></span></div>
    <div class="expression" id="expression"></div>
    <div class="literal"><span class="arrow">→ literally:</span> <span id="literal"></span></div>
    <div class="divider"></div>

    <div class="block">
      <div class="block-label">Meaning</div>
      <div class="block-text" id="meaning"></div>
    </div>
    <div class="block">
      <div class="block-label">Where it comes from</div>
      <div class="block-text" id="origin"></div>
    </div>
  </div>

  <div class="footer">
    <span class="app-url">worldexpressions.app</span>
    <span class="register-badge" id="register"></span>
  </div>
  <div class="bottom-strip"></div>
</div>

<script>
  const DATA = {
    "flag": "🇯🇵",
    "langLabel": "From Japanese",
    "expression": "Saru mo ki kara ochiru",
    "literal": "“even monkeys fall from trees”",
    "meaning": "Even <b>experts make mistakes</b> — no one is beyond a slip.",
    "origin": "Monkeys are born climbers, yet even they lose their grip and fall. A humble reminder that mastery never means immunity from error.",
    "register": "standard"
};
  for (const [k, v] of Object.entries(DATA)) {
    const el = document.getElementById(k);
    if (el) el.innerHTML = v;
  }
</script>
</body>
</html>
