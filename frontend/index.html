<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expressions du Monde</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5ff;
      --card-bg: #ffffff;
      --text: #1e1b4b;
      --text-muted: #6b7280;
      --border: #e5e1f8;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HERO ─────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #ece8ff 0%, #dff0ff 50%, #e8f8f0 100%);
      padding: 72px 24px 56px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '\201C';
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-size: 480px;
      color: rgba(124,58,237,0.06);
      top: -160px;
      right: -40px;
      pointer-events: none;
      line-height: 1;
    }

    .hero-label {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #9d8fd4;
      margin-bottom: 20px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .hero-title em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-subtitle {
      font-size: 1rem;
      font-weight: 300;
      color: var(--text-muted);
      margin-bottom: 44px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    /* ── SEARCH BAR ───────────────────────────── */
    .search-wrap {
      max-width: 580px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 18px 56px 18px 26px;
      font-size: 1.05rem;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 100px;
      background: #fff;
      box-shadow: 0 8px 40px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.1);
      outline: none;
      color: var(--text);
      transition: box-shadow 0.2s;
    }

    .search-input::placeholder { color: #a8a29e; }
    .search-input:focus { box-shadow: 0 8px 48px rgba(124,58,237,0.15), 0 0 0 2px #c4b5fd; }

    .search-icon {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: #a8a29e;
      pointer-events: none;
    }

    /* ── MAIN ─────────────────────────────────── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    /* ── STATE MESSAGES ───────────────────────── */
    .state-msg {
      text-align: center;
      padding: 64px 24px;
    }

    .state-msg .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .state-msg h3 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .state-msg p {
      font-size: 0.9rem;
      color: #a8a29e;
    }

    .state-msg .hints {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .hint-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      min-width: 70px;
      transition: border-color 0.18s, color 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .hint-icon {
      font-size: 1.5rem;
      line-height: 1;
    }

    .hint-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
      box-shadow: 0 3px 10px rgba(124,58,237,0.1);
    }

    /* ── RESULTS SUMMARY ──────────────────────── */
    .results-summary {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .results-summary b { color: var(--text); }

    .summary-tags {
      display: inline-flex;
      gap: 6px;
      margin-left: 8px;
    }

    .stag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .stag-exact { background: #d1fae5; color: #065f46; }
    .stag-sem   { background: #ede9fe; color: #6d28d9; }

    /* ── CARDS ────────────────────────────────── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 26px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.04);
      transition: box-shadow 0.18s, border-color 0.18s;
    }

    .card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.09);
      border-color: #d4c8b5;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .expr-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;
      color: var(--text);
      line-height: 1.3;
    }

    .match-pill {
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 4px;
    }

    .match-exact    { background: #d1fae5; color: #065f46; }
    .match-semantic { background: #ede9fe; color: #6d28d9; }

    /* ── META ROW ─────────────────────────────── */
    .card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 14px;
    }

    .reg-pill {
      font-size: 0.73rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .reg-standard { background: #dbeafe; color: #1d4ed8; }
    .reg-informal { background: #ede9fe; color: #6d28d9; }
    .reg-slang    { background: #fef9c3; color: #854d0e; }
    .reg-vulgar   { background: #fce7f3; color: #9d174d; }
    .reg-formal   { background: #dcfce7; color: #166534; }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 20px;
      background: #f0ebff;
      color: #9d8fd4;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .tag-pill:hover {
      background: var(--accent-light);
      color: var(--accent);
    }

    /* ── MEANING ─────────────────────────────── */
    .meaning {
      font-size: 0.96rem;
      line-height: 1.65;
      color: #44403c;
    }

    /* ── EXPANDABLE SECTION ───────────────────── */
    .card-more {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .card-more.open {
      max-height: 600px;
      opacity: 1;
    }

    .card-more-inner {
      padding-top: 18px;
      margin-top: 16px;
      border-top: 1px solid var(--border);
    }

    .more-block { margin-bottom: 14px; }
    .more-block:last-child { margin-bottom: 0; }

    .more-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #c4b9a8;
      margin-bottom: 6px;
    }

    .more-text {
      font-size: 0.92rem;
      line-height: 1.65;
      color: #57534e;
    }

    .more-example {
      font-style: italic;
      color: #6b7280;
      padding-left: 14px;
      border-left: 3px solid #c4b5fd;
    }

    /* ── TOGGLE BUTTON ────────────────────────── */
    .toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      margin-top: 12px;
      opacity: 0.85;
      transition: opacity 0.15s;
    }

    .toggle-btn:hover { opacity: 1; text-decoration: underline; }

    .toggle-btn .arrow { font-style: normal; transition: transform 0.2s; display: inline-block; }
    .toggle-btn.open .arrow { transform: rotate(180deg); }

    /* ── COUNTRY FILTER ──────────────────────── */
    .country-filter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 2px;
    }

    .country-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(196,181,253,0.3);
      border-radius: 20px;
      padding: 5px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.15s;
    }

    .country-chip.active {
      background: rgba(255,255,255,0.92);
      border-color: var(--accent);
      color: var(--text);
      opacity: 1;
    }

    .country-chip:hover { opacity: 0.8; }
    .country-chip.active:hover { opacity: 0.85; }

    /* ── MIX BUTTON ─────────────────────────── */
    .mix-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 28px;
      height: 28px;
      background: transparent;
      border: 1.5px solid rgba(196,181,253,0.35);
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.18s;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .mix-btn:hover { border-color: var(--accent); color: var(--accent); }

    .mix-btn::after {
      content: attr(title);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,27,75,0.88);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 500;
      white-space: nowrap;
      padding: 4px 9px;
      border-radius: 7px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .mix-btn:hover::after { opacity: 1; }

    .mix-btn.active {
      background: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent);
    }

    @keyframes cardsFade {
      from { opacity: 0.25; transform: translateY(8px); }
      to   { opacity: 1;    transform: translateY(0); }
    }

    .cards-fade { animation: cardsFade 0.28s ease; }

    /* ── LANGUAGE SWITCHER ───────────────────── */
    .lang-switcher {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 200;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,0.88);
      border: 1.5px solid rgba(196,181,253,0.5);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      backdrop-filter: blur(10px);
      color: var(--text-muted);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .lang-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(124,58,237,0.12);
    }

    .lang-btn svg { flex-shrink: 0; }

    .lang-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.1);
      padding: 6px;
      min-width: 168px;
    }

    .lang-menu.hidden { display: none; }

    .lang-menu-title {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c4b9a8;
      padding: 6px 8px 8px;
    }

    .lang-option {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.87rem;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s;
    }

    .lang-option:hover { background: var(--accent-light); }

    .lang-option.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ── SCROLL INDICATOR ────────────────────── */
    .scroll-status {
      text-align: center;
      padding: 20px 0 10px;
      font-size: 0.78rem;
      color: #c4b9a8;
    }

    .scroll-sentinel {
      height: 1px;
    }

    /* ── LOADING ──────────────────────────────── */
    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 48px;
    }

    .loading-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      animation: bounce 1s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); background: var(--border); }
      50% { transform: translateY(-8px); background: #c4b5fd; }
    }
  </style>
</head>
<body>

  <!-- ── LANGUAGE SWITCHER (fixed top-right) ──── -->
  <div id="lang-switcher" class="lang-switcher">
    <button id="lang-btn" class="lang-btn" aria-label="Switch site language">
      <span id="lang-flag">🇬🇧</span>
      <svg width="17" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 17 13">
        <line x1="0" y1="1.5" x2="17" y2="1.5"/>
        <line x1="0" y1="6.5" x2="17" y2="6.5"/>
        <line x1="0" y1="11.5" x2="17" y2="11.5"/>
      </svg>
    </button>
    <div id="lang-menu" class="lang-menu hidden">
      <div class="lang-menu-title" id="lang-menu-title">Site language</div>
      <button class="lang-option active" data-lang="en">🇬🇧 English</button>
      <button class="lang-option" data-lang="fr">🇫🇷 Français</button>
      <button class="lang-option" data-lang="es">🇪🇸 Español</button>
    </div>
  </div>

  <!-- ── HERO ──────────────────────────────────── -->
  <header class="hero">
    <span id="hero-label" class="hero-label">Language &amp; Culture</span>
    <h1 id="hero-title" class="hero-title">World <em>Expressions</em></h1>
    <p id="hero-subtitle" class="hero-subtitle">Type a word, discover expressions from around the world — by text or by meaning.</p>

    <div class="search-wrap">
      <input
        id="search-input"
        class="search-input"
        type="text"
        placeholder="Try: luck, money, rain, easy…"
        autocomplete="off"
        spellcheck="false"
      />
      <svg class="search-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </div>

    <div class="country-filter">
      <span class="filter-label" id="filter-label">Expressions from</span>
      <button class="country-chip active" data-region="fr">🇫🇷 France</button>
      <button class="country-chip active" data-region="uk">🇬🇧 UK</button>
      <button class="country-chip active" data-region="us">🇺🇸 USA</button>
      <button class="country-chip active" data-region="au">🇦🇺 Australia</button>
      <button class="country-chip active" data-region="es">🇪🇸 España</button>
      <button class="mix-btn" id="mix-btn" title="Mix countries">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/>
          <line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/>
          <line x1="4" y1="4" x2="14" y2="14"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── MAIN ──────────────────────────────────── -->
  <main class="main">
    <div id="results"></div>
  </main>

  <script>
    const API      = 'http://localhost:8000';
    const input    = document.getElementById('search-input');
    const output   = document.getElementById('results');
    let timer      = null;

    const PAGE_SIZE   = 20;

      // Lie / Deception
      mensonge: '🤥', lie: '🤥', lying: '🤥', tromperie: '🤥', deception: '🤥',
      // Intelligence / Stupidity
      intelligence: '🧠', clever: '🧠', smart: '🧠',
      stupidité: '🤪', idiot: '🤪', fool: '🤪', bête: '🤪', stupide: '🤪',
      // Death
      mort: '💀', death: '💀', dead: '💀',
      // Home
      maison: '🏠', home: '🏠', house: '🏠',
      // Family
      famille: '👨‍👩‍👧', family: '👨‍👩‍👧',
      ami: '🤝', amitié: '🤝', friend: '🤝', friendship: '🤝', mate: '🤝',
      // Travel / Movement
      voyage: '✈️', travel: '✈️',
      partir: '🚶', leaving: '🚶', fuir: '🚶',
      // Weather
      soleil: '☀️', sun: '☀️', sunshine: '☀️',
      neige: '❄️', snow: '❄️', froid: '❄️', cold: '❄️',
      vent: '💨', wind: '💨',
      // Party / Fun
      fête: '🎉', party: '🎉', celebration: '🎉', fun: '🎉',
      // Sleep / Tired
      sommeil: '😴', sleep: '😴', tired: '😴', fatigue: '😴',
      // Game / Sport
      jeu: '🎮', game: '🎮', sport: '⚽',
      // Nature
      nature: '🌿', arbre: '🌳', tree: '🌳', fleur: '🌸', flower: '🌸',
      // Clothes
      vêtements: '👗', clothes: '👗', clothing: '👗',
      chapeau: '🎩', hat: '🎩',
      // Spanish synonyms
      dinero: '💰', precio: '💰', caro: '💰',
      trabajo: '💼', esfuerzo: '💪', valentía: '💪',
      animales: '🐾', pájaro: '🐦', pez: '🐟', gato: '🐱', perro: '🐕', lobo: '🐺',
      fuego: '🔥', agua: '💧',
      miedo: '😱', suerte: '🍀',
      amor: '❤️', amistad: '🤝', familia: '👨‍👩‍👧',
      alegría: '😄', tristeza: '😢', vergüenza: '😳',
      engaño: '🤥', secreto: '🔒',
      comida: '🍽️', sueño: '😴',
      viajes: '✈️', costumbres: '✈️',
      // French cultural
      verlan: '🔄', argot: '🗣️',
      // Expressions about difficulty / problems
      problème: '😤', problem: '😤', trouble: '😤', difficulté: '😤',
      courage: '💪', brave: '💪',
      // Misc
      politique: '🏛️', politics: '🏛️',
      argot: '🗣️', slang: '🗣️',
      'fair dinkum': '🦘', outback: '🏜️',
    };

    function tagIcon(tag) {
      return TAG_ICONS[tag.toLowerCase()] || TAG_ICONS[tag] || '';
    }

    // Returns all tags that share the same semantic icon as `tag` (cross-language synonyms)
    function getConceptGroup(tag) {
      const icon = tagIcon(tag);
      if (!icon) return [tag];
      return Object.entries(TAG_ICONS)
        .filter(([, v]) => v === icon)
        .map(([k]) => k);
    }

    const HINTS = {
      fr: ['pied', 'argent', 'animal', 'peur'],
      uk: ['rain', 'luck', 'time'],
      us: ['money', 'fire', 'cake'],
      au: ['mate', 'fair', 'work'],
      es: ['dinero', 'suerte', 'agua', 'trabajo'],
    };

    const T = {
      en: {
        heroLabel:      'Language & Culture',
        heroTitle:      'World <em>Expressions</em>',
        heroSubtitle:   'Type a word, discover expressions from around the world — by text or by meaning.',
        placeholder:    'Try: luck, money, rain, easy…',
        filterLabel:    'Expressions from',
        mixLabel:       'Mix countries',
        langMenuTitle:  'Site language',
        welcomeTitle:   'Type a word to explore',
        welcomeSub:     'For example…',
        noResult:       'No expression found',
        noResultSub:    'Try another word or a variant…',
        serverError:    'Server unreachable',
        serverErrorSub: 'Make sure the backend is running on localhost:8000',
        originLabel:    'Origin',
        exampleLabel:   'Example',
        toggleBtn:      'Origin &amp; example',
        exact:          'Exact',
        semantic:       'Semantic',
        summary: (n, q) => `<b>${n}</b> expression${n > 1 ? 's' : ''} for « <b>${q}</b> »`,
      },
      fr: {
        heroLabel:      'Langue & Culture',
        heroTitle:      'Expressions <em>du Monde</em>',
        heroSubtitle:   'Tapez un mot, découvrez des expressions du monde entier — par le texte ou par le sens.',
        placeholder:    'Essaie : pied, argent, animal, partir…',
        filterLabel:    'Expressions depuis',
        mixLabel:       'Mélanger les pays',
        langMenuTitle:  'Langue du site',
        welcomeTitle:   'Tapez un mot pour explorer',
        welcomeSub:     'Par exemple…',
        noResult:       'Aucune expression trouvée',
        noResultSub:    'Essaie un autre mot ou une variante…',
        serverError:    'Serveur inaccessible',
        serverErrorSub: 'Vérifie que le backend tourne sur localhost:8000',
        originLabel:    'Origine',
        exampleLabel:   'Exemple',
        toggleBtn:      'Origine &amp; exemple',
        exact:          'Exact',
        semantic:       'Sémantique',
        summary: (n, q) => `<b>${n}</b> expression${n > 1 ? 's' : ''} pour « <b>${q}</b> »`,
      },
      es: {
        heroLabel:      'Lengua & Cultura',
        heroTitle:      'Expresiones <em>del Mundo</em>',
        heroSubtitle:   'Escribe una palabra, descubre expresiones de todo el mundo — por texto o por significado.',
        placeholder:    'Prueba: dinero, suerte, agua, trabajo…',
        filterLabel:    'Expresiones de',
        mixLabel:       'Mezclar países',
        langMenuTitle:  'Idioma del sitio',
        welcomeTitle:   'Escribe una palabra para explorar',
        welcomeSub:     'Por ejemplo…',
        noResult:       'Ninguna expresión encontrada',
        noResultSub:    'Prueba otra palabra o una variante…',
        serverError:    'Servidor inalcanzable',
        serverErrorSub: 'Asegúrate de que el backend está activo en localhost:8000',
        originLabel:    'Origen',
        exampleLabel:   'Ejemplo',
        toggleBtn:      'Origen &amp; ejemplo',
        exact:          'Exacta',
        semantic:       'Semántica',
        summary: (n, q) => `<b>${n}</b> expresión${n !== 1 ? 'es' : ''} para « <b>${q}</b> »`,
      },
    };

    // ── Language switcher ─────────────────────────

    const langBtn  = document.getElementById('lang-btn');
    const langMenu = document.getElementById('lang-menu');

    langBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      langMenu.classList.toggle('hidden');
    });

    document.addEventListener('click', () => langMenu.classList.add('hidden'));

    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        uiLang = opt.dataset.lang;
        langMenu.classList.add('hidden');
        applyTranslations();
        const q = input.value.trim();
        if (q.length >= 2) fetchResults(q);
        else showWelcome();
      });
    });

    function applyTranslations() {
      const t = T[uiLang];
      document.getElementById('hero-label').textContent      = t.heroLabel;
      document.getElementById('hero-title').innerHTML        = t.heroTitle;
      document.getElementById('hero-subtitle').textContent   = t.heroSubtitle;
      document.getElementById('filter-label').textContent = t.filterLabel;
      document.getElementById('mix-btn').title             = t.mixLabel;
      document.getElementById('lang-menu-title').textContent = t.langMenuTitle;
      document.getElementById('lang-flag').textContent = { en: '🇬🇧', fr: '🇫🇷', es: '🇪🇸' }[uiLang] || '🌐';
      input.placeholder = t.placeholder;
      document.querySelectorAll('.lang-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.lang === uiLang);
      });
    }

    // ── Mix toggle ───────────────────────────────

    function applyMix(results) {
      if (!mixCountries) return results;
      const map = new Map();
      for (const expr of results) {
        const r = expr.region || 'other';
        if (!map.has(r)) map.set(r, []);
        map.get(r).push(expr);
      }
      const buckets = [...map.values()];
      const mixed = [];
      let round = 0;
      while (mixed.length < results.length) {
        let added = false;
        for (const bucket of buckets) {
          if (bucket[round] !== undefined) { mixed.push(bucket[round]); added = true; }
        }
        if (!added) break;
        round++;
      }
      return mixed;
    }

    document.getElementById('mix-btn').addEventListener('click', () => {
      mixCountries = !mixCountries;
      document.getElementById('mix-btn').classList.toggle('active', mixCountries);
      if (rawResults.length > 0) {
        allResults    = applyMix(rawResults);
        renderedCount = 0;
        const container = document.getElementById('cards-container');
        if (container) {
          container.innerHTML = '';
          container.classList.add('cards-fade');
          container.addEventListener('animationend', () => container.classList.remove('cards-fade'), { once: true });
        }
        if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
        renderBatch();
        initScrollObserver();
      }
    });

    // ── Country filter ────────────────────────────

    document.querySelectorAll('.country-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const region = chip.dataset.region;
        const willDeselect = chip.classList.contains('active');
        if (willDeselect && selectedRegions.size === 1) return;
        if (willDeselect) {
          selectedRegions.delete(region);
          chip.classList.remove('active');
        } else {
          selectedRegions.add(region);
          chip.classList.add('active');
        }
        const q = input.value.trim();
        if (q.length >= 2) fetchResults(q);
        else showWelcome();
      });
    });

    // ── Events ───────────────────────────────────

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2) { showWelcome(); return; }
      timer = setTimeout(() => fetchResults(q), 300);
    });

    document.addEventListener('click', (e) => {
      const chip = e.target.closest('.hint-chip, .tag-pill');
      if (chip && chip.dataset.query) {
        fetchConceptResults(chip.dataset.query);
      }
      if (e.target.closest('.toggle-btn')) {
        e.stopPropagation();
        const btn = e.target.closest('.toggle-btn');
        toggleCard(btn.dataset.id, btn);
      }
    });

    // ── API ──────────────────────────────────────

    async function fetchConceptResults(tag) {
      if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
      showLoading();
      const group = getConceptGroup(tag);
      const regionParam = [...selectedRegions].join(',');
      try {
        const res  = await fetch(`${API}/concept?tags=${encodeURIComponent(group.join(','))}&region=${regionParam}`);
        const data = await res.json();
        renderConceptResults(data, tag);
      } catch {
        showError();
      }
    }

    function renderConceptResults(data, tag) {
      const t    = T[uiLang];
      const icon = tagIcon(tag) || '';
      rawResults    = data.results;
      allResults    = applyMix(rawResults);
      renderedCount = 0;

      if (data.total === 0) {
        output.innerHTML = `
          <div class="state-msg">
            <div class="icon">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
              </svg>
            </div>
            <h3>${t.noResult}</h3>
            <p>${t.noResultSub}</p>
          </div>`;
        return;
      }

      const label = uiLang === 'fr'
        ? `Concept ${icon} <b>${esc(tag)}</b> — <b>${data.total}</b> expression${data.total > 1 ? 's' : ''} dans toutes les langues`
        : `Concept ${icon} <b>${esc(tag)}</b> — <b>${data.total}</b> expression${data.total > 1 ? 's' : ''} across all languages`;

      output.innerHTML = `
        <div class="results-summary">${label}</div>
        <div id="cards-container"></div>
        <div class="scroll-status" id="scroll-status"></div>
        <div class="scroll-sentinel" id="scroll-sentinel"></div>`;

      renderBatch();
      initScrollObserver();
    }

    async function fetchResults(q) {
      if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
      showLoading();
      try {
        const regionParam = [...selectedRegions].join(',');
        const res  = await fetch(`${API}/search?q=${encodeURIComponent(q)}&region=${regionParam}`);
        const data = await res.json();
        renderResults(data);
      } catch {
        showError();
      }
    }

    // ── Rendering ────────────────────────────────

    function renderResults(data) {
      const t = T[uiLang];
      rawResults    = data.results;
      allResults    = applyMix(rawResults);
      renderedCount = 0;

      if (data.total === 0) {
        output.innerHTML = `
          <div class="state-msg">
            <div class="icon">
              <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
              </svg>
            </div>
            <h3>${t.noResult}</h3>
            <p>${t.noResultSub}</p>
          </div>`;
        return;
      }

      const exactLabel = data.exact > 0
        ? `<span class="stag stag-exact">${data.exact} ${t.exact}</span>` : '';
      const semLabel = data.semantic > 0
        ? `<span class="stag stag-sem">${data.semantic} ${t.semantic}</span>` : '';

      output.innerHTML = `
        <div class="results-summary">
          ${t.summary(data.total, esc(data.query))}
          <span class="summary-tags">${exactLabel}${semLabel}</span>
        </div>
        <div id="cards-container"></div>
        <div class="scroll-status" id="scroll-status"></div>
        <div class="scroll-sentinel" id="scroll-sentinel"></div>`;

      renderBatch();
      initScrollObserver();
    }

    function renderBatch() {
      const container = document.getElementById('cards-container');
      if (!container) return;
      const batch = allResults.slice(renderedCount, renderedCount + PAGE_SIZE);
      container.innerHTML += batch.map((expr, i) => renderCard(expr, renderedCount + i)).join('');
      renderedCount += batch.length;
      updateScrollStatus();
    }

    function updateScrollStatus() {
      const el = document.getElementById('scroll-status');
      if (!el) return;
      const total = allResults.length;
      if (total <= PAGE_SIZE) { el.textContent = ''; return; }
      if (renderedCount >= total) {
        el.textContent = uiLang === 'fr'
          ? `Toutes les ${total} expressions affichées`
          : `All ${total} results shown`;
        if (scrollObserver) { scrollObserver.disconnect(); scrollObserver = null; }
      } else {
        el.textContent = uiLang === 'fr'
          ? `${renderedCount} / ${total} expressions`
          : `${renderedCount} / ${total} results`;
      }
    }

    function initScrollObserver() {
      const sentinel = document.getElementById('scroll-sentinel');
      if (!sentinel) return;
      scrollObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && renderedCount < allResults.length) {
          renderBatch();
        }
      }, { rootMargin: '300px' });
      scrollObserver.observe(sentinel);
    }

    function renderCard(expr, i) {
      const t = T[uiLang];
      const matchLabel = expr.match_type === 'exact' ? t.exact : t.semantic;
      const flag = FLAG[expr.region] || '';
      const tags = expr.tags.slice(0, 4).map(tag => {
        const icon = tagIcon(tag);
        return `<span class="tag-pill" data-query="${esc(tag)}">${icon ? icon + ' ' : ''}${esc(tag)}</span>`;
      }).join('');

      return `
        <article class="card">
          <div class="card-head">
            <span class="expr-title">${flag} ${esc(expr.expression)}</span>
            <span class="match-pill match-${expr.match_type}">${matchLabel}</span>
          </div>
          <div class="card-meta">
            <span class="reg-pill reg-${expr.register}">${expr.register}</span>
            ${tags}
          </div>
          <p class="meaning">${esc(expr.meaning)}</p>

          <div class="card-more" id="more-${i}">
            <div class="card-more-inner">
              <div class="more-block">
                <div class="more-label">${t.originLabel}</div>
                <p class="more-text">${esc(expr.origin)}</p>
              </div>
              <div class="more-block">
                <div class="more-label">${t.exampleLabel}</div>
                <p class="more-text more-example">${esc(expr.example)}</p>
              </div>
            </div>
          </div>

          <button class="toggle-btn" data-id="${i}">
            ${t.toggleBtn} <span class="arrow">&#8595;</span>
          </button>
        </article>`;
    }

    function toggleCard(id, btn) {
      const more = document.getElementById(`more-${id}`);
      const isOpen = more.classList.contains('open');
      more.classList.toggle('open', !isOpen);
      btn.classList.toggle('open', !isOpen);
    }

    // ── States ───────────────────────────────────

    function showWelcome() {
      const t = T[uiLang];
      const words = [];
      if (selectedRegions.has('fr')) words.push(...HINTS.fr);
      if (selectedRegions.has('uk')) words.push(...HINTS.uk);
      if (selectedRegions.has('us')) words.push(...HINTS.us);
      if (selectedRegions.has('au')) words.push(...HINTS.au);
      if (selectedRegions.has('es')) words.push(...HINTS.es);
      const chips = words
        .map(w => {
          const icon = tagIcon(w) || '🔍';
          return `<span class="hint-chip" data-query="${esc(w)}">
            <span class="hint-icon">${icon}</span>
            <span>${esc(w)}</span>
          </span>`;
        })
        .join('');
      output.innerHTML = `
        <div class="state-msg">
          <div class="icon">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <h3>${t.welcomeTitle}</h3>
          <p>${t.welcomeSub}</p>
          <div class="hints">${chips}</div>
        </div>`;
    }

    function showLoading() {
      output.innerHTML = `
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>`;
    }

    function showError() {
      const t = T[uiLang];
      output.innerHTML = `
        <div class="state-msg">
          <div class="icon">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <h3>${t.serverError}</h3>
          <p>${t.serverErrorSub}</p>
        </div>`;
    }

    // ── Utility ──────────────────────────────────

    function esc(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    applyTranslations();
    showWelcome();
  </script>
